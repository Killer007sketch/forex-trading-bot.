name: DOM historical L2 dataset probe
on:
  push:
    paths:
      - 'scripts/probe_dom_historical_l2.py'
      - '.github/workflows/dom-l2-historical-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Parquet reader
        run: python -m pip install 'pyarrow>=18,<25'
      - name: Probe free L2 and trades source (max one hour per type)
        run: python -u scripts/probe_dom_historical_l2.py
