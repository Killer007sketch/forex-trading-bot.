name: DOM Tardis month access check
on:
  push:
    paths:
      - 'scripts/probe_tardis_month_access.py'
      - '.github/workflows/dom-tardis-month-access.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Sep 1-3 L2 historical rights, fetch at most 2 MiB per date
        run: python -u scripts/probe_tardis_month_access.py
