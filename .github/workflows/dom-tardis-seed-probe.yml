name: DOM Tardis historical true seed probe
on:
  push:
    paths:
      - 'scripts/probe_tardis_valid_l2.py'
      - '.github/workflows/dom-tardis-seed-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe first minute on authenticated-free history
        run: python -u scripts/probe_tardis_valid_l2.py
