name: Historical EURUSD backtest
on:
  push:
    paths:
      - '.github/workflows/historical-backtest.yml'
      - 'scripts/download_eurusd.py'
      - 'src/backtest.py'
      - 'src/trend_h4.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate EURUSD H1
        run: python scripts/download_eurusd.py --from-date '2016-01-01' --to-date '2026-09-17'
      - name: Baseline H1 comparison
        run: python src/backtest.py data/eurusd_h1.csv --initial 300 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.005 | tee reports-baseline.txt
      - name: Independent H4 trend development and holdout
        run: python src/trend_h4.py data/eurusd_h1.csv --initial 300 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.0025 --min-lot 0.01 | tee reports-trend-h4.txt
      - name: Upload research outputs, not raw market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-research-comparison
          path: |
            reports-baseline.txt
            reports-trend-h4.txt
            reports/*.csv
          if-no-files-found: warn
