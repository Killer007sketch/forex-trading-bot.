name: Historical EURUSD backtest
on:
  push:
    paths:
      - '.github/workflows/historical-backtest.yml'
      - 'scripts/download_eurusd.py'
      - 'src/backtest.py'
  workflow_dispatch:
    inputs:
      from_date:
        description: First date (YYYY-MM-DD)
        required: true
        default: '2016-01-01'
      to_date:
        description: Exclusive end date (YYYY-MM-DD)
        required: true
        default: '2026-09-17'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect downloader CLI
        run: npx --yes dukascopy-node --help
      - name: Download and validate EURUSD H1
        run: python scripts/download_eurusd.py --from-date '2016-01-01' --to-date '2026-09-17'
      - name: Run research backtest
        run: python src/backtest.py data/eurusd_h1.csv --initial 300 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.005 | tee reports-summary.txt
      - name: Upload results (not raw market data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-research-results
          path: |
            reports-summary.txt
            reports/trades.csv
          if-no-files-found: warn
