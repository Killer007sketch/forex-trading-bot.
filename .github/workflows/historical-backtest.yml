name: Historical EURUSD backtest
on:
  push:
    paths:
      - '.github/workflows/historical-backtest.yml'
      - 'scripts/download_eurusd.py'
      - 'src/backtest.py'
      - 'src/trend_h4.py'
      - 'src/hybrid_h4.py'
      - 'src/robustness_h4.py'
      - 'src/bounded_grid_h4.py'
      - 'src/regime_h4.py'
      - 'src/regime_v2_h4.py'
      - 'src/test_regime_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regime v2 deterministic unit tests
        run: python src/test_regime_v2.py
      - name: Download and validate EURUSD H1
        run: python scripts/download_eurusd.py --from-date '2016-01-01' --to-date '2026-09-17'
      - name: Baseline H1 comparison at 1000 USD
        run: |
          set -o pipefail
          python src/backtest.py data/eurusd_h1.csv --initial 1000 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.005 | tee reports-baseline.txt
      - name: H4 trend-only reference at 1000 USD
        run: |
          set -o pipefail
          python src/trend_h4.py data/eurusd_h1.csv --initial 1000 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.0025 --min-lot 0.01 | tee reports-trend-h4.txt
      - name: H4 hybrid versus trend and mean reversion at 1000 USD
        run: |
          set -o pipefail
          python src/hybrid_h4.py data/eurusd_h1.csv --initial 1000 --spread-pips 1.5 --slippage-pips 0.3 --risk 0.0025 --min-lot 0.01 | tee reports-hybrid-h4.txt
      - name: Annualized out-of-sample and doubled-cost robustness audit
        run: |
          set -o pipefail
          python src/robustness_h4.py data/eurusd_h1.csv --initial 1000 --risk 0.0025 --min-lot 0.01 | tee reports-robustness.txt
      - name: Bounded grid research with independent holdout and cost stress
        run: |
          set -o pipefail
          python src/bounded_grid_h4.py data/eurusd_h1.csv --initial 1000 --min-lot 0.01 | tee reports-grid.txt
      - name: Causal H4 regime classifier diagnostic
        run: |
          set -o pipefail
          python src/regime_h4.py data/eurusd_h1.csv | tee reports-regime.txt
      - name: Compare causal regime v1 versus v2 on identical data
        run: |
          set -o pipefail
          python src/regime_v2_h4.py data/eurusd_h1.csv | tee reports-regime-v2.txt
      - name: Upload research outputs, not raw market data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-grid-1000-research
          path: |
            reports-*.txt
            reports/*.csv
            reports/*.json
          if-no-files-found: warn
