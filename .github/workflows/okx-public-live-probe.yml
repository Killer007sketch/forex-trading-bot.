name: OKX public swap live feed probe
on:
  push:
    paths:
      - research/okx_public_live_probe.py
      - .github/workflows/okx-public-live-probe.yml
  workflow_dispatch:
jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'aiohttp>=3.10,<4' 'websockets>=13,<16'
      - run: python research/okx_public_live_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-live-connectivity-result
          path: okx_live_probe.json
          if-no-files-found: warn
