name: Strategy A entry optimization research
on:
  push:
    paths:
      - '.github/workflows/strategy-a-entry-optimization.yml'
      - 'src/strategy_a_entry_optimization_h1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing strategy and flat detector tests
        run: |
          python src/test_compare_tpo_atr_h1.py
          python src/strategy_a_no_hedge_trailing_h1.py --self-test
      - name: Entry filters and same-baseline arithmetic
        run: python src/strategy_a_entry_optimization_h1.py --self-test
      - name: Download historical EURUSD and validate
        run: python scripts/download_eurusd.py --from-date '2016-01-01' --to-date '2026-09-17'
      - name: Research entry candidates without live orders
        run: |
          set -o pipefail
          python src/strategy_a_entry_optimization_h1.py data/eurusd_h1.csv | tee strategy-a-entry-run.log
      - name: Archive research metrics and trade logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-a-entry-optimization
          path: |
            strategy-a-entry-run.log
            reports/strategy_a_entry_optimization_report.json
            reports/strategy_a_entry_*.csv
          if-no-files-found: warn
